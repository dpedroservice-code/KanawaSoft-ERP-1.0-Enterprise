name: Kanawa Soft — validação da aplicação principal

on:
  push:
    branches:
      - main
      - chore/cloudflare-only-staging
  pull_request:
    branches:
      - main
      - feat/auth-otp-edit-integration-latest
  workflow_dispatch:

permissions:
  contents: read

# A publicação de produção é feita pela integração Cloudflare Workers Builds,
# ligada directamente ao repositório e à branch main. Este workflow valida código;
# não cria previews nem tenta uma segunda publicação com segredos do GitHub.

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check app/app.js
          node --check app/cloud.js
          node --check app/i18n.js
          node --check app/runtime-config.js
          node --check worker.mjs
          node --check app/fatura-modelos.js
          node --check app/fiscal-documents.js
          node --check app/table-enhancements.js
          node --check app/module-reorganization.js
          node --check app/industrial-manufacturing.js
          node --check app/industrial-enterprise.js
          node --check app/sidebar.js
          node --check app/ui-enhancements.js
          node --check server/server.js
          node --check server/database.js
          node --check server/agt/jws.js
          node --check server/agt/saft-accounting.js
          node --check supabase/functions/_shared/saft-accounting.js
          node --check scripts/agt/validate-saft.js
      - name: Install XML schema validator
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
      - name: Install project dependencies
        run: npm install --ignore-scripts
      - name: Run automated tests
        run: npm test
