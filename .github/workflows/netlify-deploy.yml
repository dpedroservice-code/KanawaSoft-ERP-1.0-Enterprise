name: Netlify deploy

on:
  pull_request:
    branches:
      - main
      - feat/isolated-supabase-foundation
      - integrate/kanawasoft-all-requests-2026-11-08
      - fix/kanawa-ui-navigation-layout-2026-11-07
      - feat/kanawa-theme-layout-customizer-preview9
  push:
    branches:
      - main
      - feat/erp-integrations-preview
      - fix/kanawa-pos-invoice-topnav-2026-11-08
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install XML schema validator
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
      - name: Install project dependencies
        run: npm install --ignore-scripts
      - name: Run automated tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check app/app.js
          node --check app/cloud.js
          node --check app/fatura-modelos.js
          node --check app/fiscal-documents.js
          node --check app/table-enhancements.js
          node --check app/module-reorganization.js
          node --check app/industrial-manufacturing.js
          node --check app/industrial-enterprise.js
          node --check app/sidebar.js
          node --check app/ui-enhancements.js
          node --check app/workspace-state.js
          node --check app/workspace-windows.js
          node --check app/layout-customizer.js
          node --check server/server.js
          node --check server/database.js
          node --check server/agt/jws.js
          node --check server/agt/saft-accounting.js
          node --check supabase/functions/_shared/saft-accounting.js
          node --check scripts/agt/validate-saft.js

  deploy:
    # Netlify GitHub integration already creates PR previews; keep PR checks independent of a personal access token.
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    needs: validate
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: 823b46a1-685f-4dbf-94ed-b3b770135bc9
    steps:
      - name: Detect Netlify credentials
        id: netlify_credentials
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Netlify deployment skipped: NETLIFY_AUTH_TOKEN is not configured. The Cloudflare preview remains the preview target for this branch."
          fi

      - name: Require Netlify site configuration
        if: ${{ steps.netlify_credentials.outputs.available == 'true' }}
        run: |
          if [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_SITE_ID is not configured."
            exit 1
          fi

      - name: Checkout repository
        if: ${{ steps.netlify_credentials.outputs.available == 'true' }}
        uses: actions/checkout@v4

      - name: Deploy pull request preview
        if: ${{ steps.netlify_credentials.outputs.available == 'true' && github.event_name == 'pull_request' }}
        id: preview
        run: |
          OUTPUT=$(npx --yes netlify-cli@23.11.0 deploy --dir=app --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message "Kanawa Soft PR #${{ github.event.pull_request.number }}" --json)
          echo "$OUTPUT"
          URL=$(printf '%s' "$OUTPUT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const x=JSON.parse(s);console.log(x.deploy_url||x.deployUrl||x.url||'')}catch(e){process.exit(1)}})")
          if [ -z "$URL" ]; then
            echo "::error::Netlify did not return a preview URL."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Kanawa Soft — preview do PR #${{ github.event.pull_request.number }}"
            echo ""
            echo "URL de teste: $URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy isolated ERP feature preview
        if: ${{ steps.netlify_credentials.outputs.available == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/feat/erp-integrations-preview' }}
        run: npx --yes netlify-cli@23.11.0 deploy --dir=app --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --alias=kanawa-soft-erp-1-0-preview --message "Kanawa Soft ERP 1.0 feature preview ${{ github.sha }}" --json

      - name: Deploy production after merge to main
        if: ${{ steps.netlify_credentials.outputs.available == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: npx --yes netlify-cli@23.11.0 deploy --prod --dir=app --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message "Kanawa Soft production ${{ github.sha }}" --json

      - name: Create manual preview
        if: ${{ steps.netlify_credentials.outputs.available == 'true' && github.event_name == 'workflow_dispatch' }}
        run: npx --yes netlify-cli@23.11.0 deploy --dir=app --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message "Kanawa Soft manual preview ${{ github.sha }}" --json
