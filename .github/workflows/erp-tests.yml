name: KanawaSoft ERP checks

on:
  push:
    branches:
      - fix/manager-modules-i18n-2026-11-12
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run ERP test suite
        run: npm test
